name: 🧠 Auto-Create Issues from tasks.yml

on:
  workflow_dispatch:          # manual run
  push:
    paths:
      - "tasks.yml"           # re-run when tasks.yml changes

jobs:
  generate_issues:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          pip install pyyaml requests

      - name: Create issues from tasks.yml
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
        run: |
          python - <<'PY'
          import os, sys, yaml, requests

          token = os.environ["GITHUB_TOKEN"]
          repo  = os.environ["REPO"]
          base  = f"https://api.github.com/repos/{repo}"
          H = {"Authorization": f"Bearer {token}",
               "Accept": "application/vnd.github+json"}

          # load YAML
          with open("tasks.yml", "r", encoding="utf-8") as f:
              data = yaml.safe_load(f)

          # --- helpers ---
          def get_all(url):
              out, page = [], 1
              while True:
                  r = requests.get(f"{url}?per_page=100&page={page}", headers=H)
                  r.raise_for_status()
                  items = r.json()
                  if not items: break
                  out.extend(items); page += 1
              return out

          def ensure_label(name, color="0e8a16", description=None):
              r = requests.get(f"{base}/labels/{name}", headers=H)
              if r.status_code == 200:
                  return
              payload = {"name": name, "color": color}
              if description: payload["description"] = description
              res = requests.post(f"{base}/labels", headers=H, json=payload)
              if res.status_code not in (200,201):
                  print(f"⚠️  Label '{name}' failed: {res.status_code} {res.text}")

          # ensure labels
          ensure_label("AI-Task", "0e8a16", "Agentic AI backlog item")
          weeks = set()
          for ph in data["phases"]:
              weeks.add(str(ph["week"]))
          for w in weeks:
              ensure_label(f"Week-{w}", "5319e7", f"Week {w}")

          # existing issue titles (state: all)
          existing = {i["title"] for i in get_all(f"{base}/issues?state=all") if "pull_request" not in i}

          # create issues per task
          for ph in data["phases"]:
              week = ph["week"]
              phase_name = ph["name"]
              for t in ph["tasks"]:
                  title = f"[{t['id']}] {t['title']}"
                  if title in existing:
                      print(f"• Skip (exists): {title}")
                      continue
                  body = (
                      f"**Phase:** {phase_name}\n"
                      f"**Week:** {week}\n\n"
                      f"**Description:** {t['desc']}\n\n"
                      f"_Source: `tasks.yml`_\n"
                  )
                  payload = {"title": title, "body": body, "labels": [f"Week-{week}", "AI-Task"]}
                  res = requests.post(f"{base}/issues", headers=H, json=payload)
                  if res.status_code == 201:
                      print(f"✅ Created: {title}")
                  else:
                      print(f"❌ Failed: {title} -> {res.status_code} {res.text}")
                      sys.exit(1)
          PY
